active_slam_explorer:
  ros__parameters:
    map_topic: "/map"
    global_costmap_topic: "/global_costmap/costmap"
    global_frame: "map"
    robot_frame: "base_link"
    marker_topic: "/active_slam/markers"
    algorithm_mode: "aslam_original"
    frontier_source: "rrt"
    rrt_eta: 0.5
    rrt_samples_per_cycle: 80
    rrt_include_global: true
    rrt_include_local: true
    rrt_random_seed: -1
    publish_detected_points: true
    detected_points_topic: "/active_slam/detected_points"
    filtered_points_topic: "/active_slam/filtered_points"
    frontier_collection_time_sec: 3.0
    min_raw_frontiers_before_planning: 5
    max_goal_search_time_sec: 15.0
    frontier_clustering_mode: "mean_shift_like"
    frontier_merge_radius: 0.5
    frontier_meanshift_bandwidth: 1.0
    frontier_meanshift_max_iterations: 20
    frontier_meanshift_tolerance: 0.05
    frontier_meanshift_min_cluster_size: 1
    frontier_meanshift_warn_if_clusters_less_than: 3
    frontier_buffer_timeout_sec: 2.0
    enable_nav2_goal_fallback: false
    nav2_goal_search_radius: 0.8
    nav2_goal_search_step: 0.10
    nav2_goal_max_cost: 30
    nav2_goal_min_clearance: 0.35
    nav2_goal_clearance_check_radius: 0.45
    nav2_path_max_cost: 50
    nav2_path_clearance_radius: 0.25
    debug_safe_goal_search: true
    enable_frontier_suppression: true
    frontier_suppression_radius: 0.6
    frontier_suppression_timeout_sec: 30.0
    frontier_suppression_max_failures: 2
    frontier_suppression_max_regions: 50
    enable_frontier_viewpoint_goal: false
    frontier_min_cluster_size: 5
    frontier_connectivity: 8
    lambda_decay: 0.6
    unknown_probability: 0.1
    known_probability: 0.45
    w_entropy: 1.0
    w_distance: 1.0
    enable_navigation: true
    use_pose_graph_score: false
    decision_rate_hz: 0.2
    goal_reached_distance: 0.3
    goal_timeout_sec: 180.0
    frontier_goal_offset: 0.45
    goal_search_radius_cells: 8
    costmap_clearing_threshold: 70
    frontier_costmap_threshold: 85
    nav_goal_costmap_threshold: 70
    allow_unknown_goal: false
    info_radius: 1.0
    information_threshold: 0.45
    planner_action_name: "compute_path_to_pose"
    planner_id: "GridBased"
    planner_validation_period_sec: 0.0
    planner_request_timeout_sec: 3.0
    planner_cache_ttl_sec: 1.0
    planner_cache_radius: 0.05
    min_frontier_distance: 0.25
    visited_radius: 0.10
    visited_timeout_sec: 10.0
    post_goal_settle_time_sec: 0.5
    debug_visited_goals: true
    min_goal_separation: 0.4
    goal_send_period_sec: 3.0
    blacklist_radius: 0.35
    blacklist_timeout_sec: 10.0
    rejected_blacklist_timeout_sec: 5.0
    max_goal_retries: 2
    keep_selecting_markers_while_navigating: true
    show_preview_while_navigating: false
    debug_markers: true
    navigate_action_name: "navigate_to_pose"
